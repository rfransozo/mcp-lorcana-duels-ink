version: 1
name: mcp-lorcana-duels-ink
runtime: python
entry: src/server.py
description: >
  Play Disney Lorcana on Duels.ink. Run matches against the bot or ranked
  opponents, manage decks, search the full card catalog, and review stats
  and replays.
tags:
  - lorcana
  - disney-lorcana
  - trading-card-game
  - tcg
  - card-game
  - deckbuilding
  - gaming
  - duels-ink
build:
  install: pip install -r requirements.txt
startCommand:
  type: http
  command: python src/server.py

# Cada jogador usa a PRÓPRIA conta do Duels.ink. Sem isto o servidor roda em
# modo "shared" e ninguém é solicitado a informar o cookie.
# ⚠️  A chave é `credentials` — `user_secrets` NÃO existe no schema do manifest
#     e é descartada em silêncio.
credentials_mode: per_user
credentials:
  - name: DUELS_SESSION_COOKIE
    required: false
    description: >
      Optional. Your own Duels.ink session cookie. It unlocks your decks, ranked
      matchmaking, private tables, friends and match history, and every request
      is made as you. Without it the server still works anonymously for bot
      games, the card catalog and public decks. To get it: sign in at
      https://duels.ink, open DevTools (F12), go to Application > Cookies >
      https://duels.ink, and copy the value of the cookie named
      __Secure-better-auth.session_token. Sessions last about 30 days, so it
      needs refreshing periodically.
    placeholder: __Secure-better-auth.session_token value
    docs_url: https://duels.ink
    mapping:
      env: DUELS_SESSION_COOKIE
